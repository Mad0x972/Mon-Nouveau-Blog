<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0c2f38;
        }
        #s2-cam,
        .s2-plane {
          position: absolute;
          inset: 0;
          transform-origin: 60% 55%;
        }
        .s2-plane canvas {
          position: absolute;
          left: -96px;
          top: -54px;
          width: 2112px;
          height: 1188px;
        }
        #s2-light {
          mix-blend-mode: screen;
        }
        #s2-fx {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
        }
      </style>

      <div id="root" data-composition-id="s2-etoile" data-width="1920" data-height="1080">
        <div id="s2-cam" data-layout-allow-overflow>
          <div class="s2-plane" id="s2-p0" data-layout-allow-overflow></div>
          <div class="s2-plane" id="s2-pstar" data-layout-allow-overflow></div>
          <div class="s2-plane" id="s2-p1" data-layout-allow-overflow></div>
          <div class="s2-plane" id="s2-plight" data-layout-allow-overflow></div>
          <div class="s2-plane" id="s2-p2" data-layout-allow-overflow></div>
        </div>
        <canvas id="s2-fx" width="1920" height="1080" data-layout-allow-overflow></canvas>
      </div>

      <script>
        (function () {
          const P = window.Painter;
          const W = 2112,
            H = 1188;
          const DUR = 12.9;
          // l'étoile termine sa chute ici (coordonnées du plan)
          const SX = 1120,
            SY = 360,
            SR = 330;
          const FALL0 = 2.0,
            FALL1 = 5.0;

          // ---------------------------------------------------------- plan 0 : forêt turquoise
          const base0 = P.canvas(W, H);
          {
            const c = base0.getContext("2d");
            const R = P.rng(1201);
            P.vgrad(c, W, H, [
              [0, "#0a2731"],
              [0.35, "#11505a"],
              [0.7, "#156067"],
              [1, "#0d3a44"],
            ]);
            P.glow(c, 520, 120, 900, "#2f9e98", 0.55);
            P.glow(c, SX, SY, 700, "#3fb2a2", 0.35);
            // troncs lointains : grands fûts verticaux
            for (let layer = 0; layer < 3; layer++) {
              const n = [34, 22, 12][layer];
              for (let i = 0; i < n; i++) {
                const x = R() * W;
                const w = [14, 30, 52][layer] * (0.6 + R() * 0.8);
                const col = P.mix(["#2a7a7c", "#1b5d63", "#103f48"][layer], "#0a2a33", R() * 0.3);
                c.fillStyle = col;
                c.beginPath();
                c.moveTo(x - w / 2, H);
                c.lineTo(x - w * 0.36, -40);
                c.lineTo(x + w * 0.36, -40);
                c.lineTo(x + w / 2, H);
                c.closePath();
                c.fill();
                // reflets turquoise sur un côté
                c.fillStyle = P.rgba("#5fc7b8", 0.12 + 0.1 * layer);
                c.fillRect(x - w * 0.36, -40, w * 0.18, H + 40);
              }
              P.fog(c, R, -100, 200, W + 100, H, 18, 160, 420, "#2f8f8c", 0.16);
            }
          }
          const paint0 = P.brushify(base0, {
            seed: 12,
            flowAngle: -Math.PI / 2,
            flowSpread: 1.4,
            edgeThreshold: 12,
            passes: [
              { size: 18, len: 60, density: 1.2, alpha: 0.5, jitter: 16 },
              { size: 8, len: 28, density: 1.0, alpha: 0.55, jitter: 16 },
              { size: 3, len: 12, density: 0.5, alpha: 0.6, jitter: 18, edge: 20 },
            ],
          });
          P.mount(document.getElementById("s2-p0"), paint0);

          // ---------------------------------------------------------- étoile (dessinée une fois, déplacée ensuite)
          const starCan = P.canvas(900, 900);
          {
            const c = starCan.getContext("2d");
            const R = P.rng(77);
            const cx = 450,
              cy = 450;
            P.glow(c, cx, cy, 440, "#e9f59a", 0.55);
            // facettes
            const pts = [];
            for (let i = 0; i < 10; i++) {
              const rr = i % 2 ? SR * 0.42 : SR;
              const a = -0.18 + (i * Math.PI) / 5 - Math.PI / 2;
              pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
            }
            for (let i = 0; i < 10; i++) {
              const a = pts[i],
                b = pts[(i + 1) % 10];
              const tone = i % 2 ? "#f7e86a" : "#fff7b8";
              c.fillStyle = P.mix(tone, "#c8e48a", R() * 0.35);
              c.beginPath();
              c.moveTo(cx, cy);
              c.lineTo(a[0], a[1]);
              c.lineTo(b[0], b[1]);
              c.closePath();
              c.fill();
            }
            // touches de peinture dans l'étoile
            c.save();
            P.starPath(c, cx, cy, SR, 0.42, -0.18);
            c.clip();
            for (let i = 0; i < 1600; i++) {
              const x = cx + (R() - 0.5) * SR * 2,
                y = cy + (R() - 0.5) * SR * 2;
              c.fillStyle = P.rgba(P.mix("#ffd84a", "#fffbe0", R()), 0.25 + R() * 0.3);
              c.beginPath();
              c.ellipse(x, y, 6 + R() * 16, 2 + R() * 5, -0.7 + (R() - 0.5) * 0.6, 0, P.TAU);
              c.fill();
            }
            P.glow(c, cx, cy, SR * 0.6, "#ffe066", 0.55);
            c.restore();
            // liseré rosé (comme la référence)
            c.strokeStyle = "rgba(255,190,200,0.55)";
            c.lineWidth = 4;
            P.starPath(c, cx, cy, SR, 0.42, -0.18);
            c.stroke();
          }
          const starLayer = P.mount(document.getElementById("s2-pstar"), P.canvas(W, H));
          const smallStars = [];
          {
            const R = P.rng(88);
            for (let i = 0; i < 10; i++) smallStars.push({ x: 200 + R() * 1700, y: -60 + R() * 700, r: 14 + R() * 30, v: 6 + R() * 12, rot: R() * 6, ph: R() * 6 });
          }

          // ---------------------------------------------------------- plan 1 : pente enneigée et écurie
          const base1 = P.canvas(W, H);
          const DOOR = { x: 1536, y: 640, w: 74, h: 112 }; // ouverture de la porte de box (plan 1)
          {
            const c = base1.getContext("2d");
            const R = P.rng(1301);
            // pente
            const g = c.createLinearGradient(700, 500, 1500, H);
            g.addColorStop(0, "#6fb7b4");
            g.addColorStop(0.5, "#3f8b92");
            g.addColorStop(1, "#1e5560");
            c.fillStyle = g;
            c.beginPath();
            c.moveTo(560, H);
            c.bezierCurveTo(900, 900, 1200, 760, 1400, 690);
            c.bezierCurveTo(1650, 600, 1900, 560, W, 520);
            c.lineTo(W, H);
            c.closePath();
            c.fill();
            // modelé de la neige : congères éclairées par l'étoile, creux bleutés
            c.save();
            c.clip();
            for (let i = 0; i < 900; i++) {
              const x = 560 + R() * 1560,
                y = 520 + R() * 680;
              const lit = Math.max(0, 1 - Math.hypot(x - SX, y - SY) / 1100);
              c.fillStyle = R() < 0.6 ? P.rgba(P.mix("#7cc3bd", "#e3f6c8", lit), 0.25 + 0.35 * R()) : P.rgba("#1b4a5a", 0.2 + 0.2 * R());
              c.beginPath();
              c.ellipse(x, y, 20 + R() * 60, 3 + R() * 6, -0.35 + (R() - 0.5) * 0.3, 0, P.TAU);
              c.fill();
            }
            c.restore();
            // jeunes sapins sur la pente
            [
              [980, 860, 90],
              [1060, 830, 70],
              [1290, 742, 60],
              [1930, 600, 110],
              [2010, 590, 80],
            ].forEach(([x, y, h]) => P.fir(c, R, x, y, h, h * 0.62, "#123a42", "#2c6e70", "rgba(205,235,229,0.85)"));
            // neige éclairée sur la crête
            c.strokeStyle = "rgba(196,236,226,0.75)";
            c.lineWidth = 8;
            c.beginPath();
            c.moveTo(620, H - 30);
            c.bezierCurveTo(920, 890, 1210, 752, 1400, 686);
            c.bezierCurveTo(1650, 598, 1900, 556, W, 516);
            c.stroke();
            // écurie
            const bx = 1440,
              by = 560;
            c.fillStyle = "#1a2c33";
            c.fillRect(bx, by, 330, 210);
            c.fillStyle = "#22373f";
            for (let i = 0; i < 11; i++) c.fillRect(bx + i * 30 + 2, by, 3, 210);
            // toit enneigé
            c.fillStyle = "#13242b";
            c.beginPath();
            c.moveTo(bx - 40, by + 10);
            c.lineTo(bx + 165, by - 120);
            c.lineTo(bx + 370, by + 10);
            c.closePath();
            c.fill();
            c.fillStyle = "#cdebe5";
            c.beginPath();
            c.moveTo(bx - 52, by + 14);
            c.lineTo(bx + 165, by - 132);
            c.lineTo(bx + 382, by + 14);
            c.lineTo(bx + 372, by + 2);
            c.quadraticCurveTo(bx + 260, by - 70, bx + 165, by - 112);
            c.quadraticCurveTo(bx + 60, by - 60, bx - 42, by + 2);
            c.closePath();
            c.fill();
            // lucarne
            c.fillStyle = "#13242b";
            c.fillRect(bx + 140, by - 70, 50, 50);
            c.fillStyle = "#ff8a4a";
            c.fillRect(bx + 150, by - 60, 30, 32);
            // fenêtres chaudes
            [
              [bx + 220, by + 60],
              [bx + 280, by + 60],
            ].forEach(([x, y]) => {
              c.fillStyle = "#0e1b20";
              c.fillRect(x - 4, y - 4, 44, 58);
              c.fillStyle = "#ff6a3d";
              c.fillRect(x, y, 36, 50);
              c.fillStyle = "#ffb46b";
              c.fillRect(x + 4, y + 4, 12, 18);
              c.fillStyle = "#0e1b20";
              c.fillRect(x + 16, y, 4, 50);
              c.fillRect(x, y + 23, 36, 4);
            });
            // porte de box (moitié haute ouverte, intérieur sombre et chaud)
            c.fillStyle = "#3a1d16";
            c.fillRect(DOOR.x, DOOR.y - 2, DOOR.w, DOOR.h);
            P.glow(c, DOOR.x + DOOR.w / 2, DOOR.y + 40, 70, "#ff8a4a", 0.5);
            c.fillStyle = "#24363d";
            c.fillRect(DOOR.x - 6, DOOR.y + DOOR.h - 2, DOOR.w + 12, 60);
            c.strokeStyle = "#13232a";
            c.lineWidth = 3;
            c.strokeRect(DOOR.x - 6, DOOR.y + DOOR.h - 2, DOOR.w + 12, 60);
            c.beginPath();
            c.moveTo(DOOR.x - 6, DOOR.y + DOOR.h - 2);
            c.lineTo(DOOR.x + DOOR.w + 6, DOOR.y + DOOR.h + 58);
            c.stroke();
            c.fillStyle = "rgba(205,235,229,0.85)";
            c.fillRect(DOOR.x - 8, DOOR.y + DOOR.h - 6, DOOR.w + 16, 6);
            // lanterne au pied de l'escalier
            c.fillStyle = "#13232a";
            c.fillRect(1004, 1010, 6, 70);
            c.fillStyle = "#ffbf6b";
            c.fillRect(996, 990, 22, 26);
            P.glow(c, 1007, 1003, 120, "#ffa24f", 0.45);
            // escalier qui descend la pente
            for (let i = 0; i < 12; i++) {
              const x = 1380 - i * 34,
                y = 760 + i * 30;
              c.fillStyle = "#18303a";
              c.fillRect(x, y, 70, 12);
              c.fillStyle = "rgba(200,236,228,0.8)";
              c.fillRect(x, y - 4, 70, 5);
            }
            // poteaux de barrière
            for (let i = 0; i < 7; i++) {
              const x = 1820 + i * 46,
                y = 690 - i * 18;
              c.fillStyle = "#14262d";
              c.fillRect(x, y, 10, 70);
              c.fillStyle = "#cdebe5";
              c.fillRect(x - 2, y - 6, 14, 8);
            }
            // arbustes / brindilles rouges (comme la référence)
            for (let i = 0; i < 120; i++) {
              const x = 900 + R() * 1200,
                y = 820 + R() * 360;
              c.strokeStyle = P.rgba(P.mix("#7a2a2a", "#c2523c", R()), 0.7);
              c.lineWidth = 1.5 + R() * 2;
              c.beginPath();
              c.moveTo(x, y);
              c.lineTo(x + (R() - 0.5) * 40, y - 20 - R() * 40);
              c.stroke();
            }
          }
          const paint1 = P.brushify(base1, {
            seed: 22,
            mask: true,
            flowAngle: -0.5,
            flowSpread: 1.6,
            passes: [
              { size: 12, len: 40, density: 1.0, alpha: 0.5, jitter: 14 },
              { size: 5, len: 18, density: 1.0, alpha: 0.55, jitter: 14 },
              { size: 2.4, len: 9, density: 0.7, alpha: 0.7, jitter: 14, edge: 24 },
            ],
          });
          const p1 = document.getElementById("s2-p1");
          P.mount(p1, paint1);
          const horseLayer = P.mount(p1, P.canvas(W, H));

          // ---------------------------------------------------------- lumière de l'étoile (s'allume à l'atterrissage)
          const lightCan = P.canvas(W, H);
          {
            const c = lightCan.getContext("2d");
            P.glow(c, SX, SY + 80, 1100, "#d6f08a", 0.55);
            P.glow(c, SX, SY, 520, "#fff4a8", 0.6);
            c.filter = "blur(30px)";
            const R = P.rng(9);
            for (let i = 0; i < 16; i++) {
              const a = R() * P.TAU,
                len = 1300,
                sp = 0.025 + R() * 0.05;
              c.fillStyle = "rgba(220,245,160,0.18)";
              c.beginPath();
              c.moveTo(SX, SY);
              c.lineTo(SX + Math.cos(a - sp) * len, SY + Math.sin(a - sp) * len);
              c.lineTo(SX + Math.cos(a + sp) * len, SY + Math.sin(a + sp) * len);
              c.closePath();
              c.fill();
            }
            c.filter = "none";
          }
          P.mount(document.getElementById("s2-plight"), lightCan).id = "s2-light";

          // ---------------------------------------------------------- plan 2 : avant-plan sombre, ruisseau gelé
          const base2 = P.canvas(W, H);
          {
            const c = base2.getContext("2d");
            const R = P.rng(1401);
            [
              [60, 140],
              [300, 90],
              [2050, 120],
            ].forEach(([x, w]) => {
              c.fillStyle = "#081f25";
              c.beginPath();
              c.moveTo(x - w / 2, H + 20);
              c.lineTo(x - w * 0.42, -80);
              c.lineTo(x + w * 0.42, -80);
              c.lineTo(x + w / 2, H + 20);
              c.closePath();
              c.fill();
              c.fillStyle = "rgba(95,199,184,0.18)";
              c.fillRect(x + w * 0.22, -80, w * 0.16, H + 100);
            });
            // berge et ruisseau
            c.fillStyle = "#0b2a31";
            c.beginPath();
            c.moveTo(0, 1060);
            c.bezierCurveTo(500, 1000, 900, 1080, 1300, 1050);
            c.bezierCurveTo(1600, 1030, 1900, 1080, W, 1040);
            c.lineTo(W, H);
            c.lineTo(0, H);
            c.closePath();
            c.fill();
            c.fillStyle = "#2c7c7b";
            c.beginPath();
            c.moveTo(380, H);
            c.bezierCurveTo(700, 1080, 1100, 1110, 1500, H);
            c.closePath();
            c.fill();
            c.fillStyle = "rgba(190,240,200,0.5)";
            for (let i = 0; i < 40; i++) c.fillRect(600 + R() * 700, 1110 + R() * 70, 20 + R() * 60, 3);
          }
          const paint2 = P.brushify(base2, {
            seed: 32,
            mask: true,
            flowAngle: -Math.PI / 2,
            flowSpread: 1.0,
            passes: [
              { size: 14, len: 50, density: 1.0, alpha: 0.5, jitter: 12 },
              { size: 5, len: 20, density: 0.9, alpha: 0.55, jitter: 12 },
            ],
          });
          P.mount(document.getElementById("s2-p2"), paint2);

          // ---------------------------------------------------------- éléments vivants
          const fx = document.getElementById("s2-fx");
          const fctx = fx.getContext("2d");
          const snow = P.makeSnow(21, 160, 1920, 1080, { rmin: 1, rmax: 4, vmin: 16, vmax: 60, wind: -8, color: "#e8fff6" });
          const tex = P.paperTexture(300, 260, 4);
          const hcan = P.canvas(300, 260);
          const hctx = hcan.getContext("2d");

          function starPos(t) {
            const u = P.smooth((t - FALL0) / (FALL1 - FALL0));
            const e = 1 - Math.pow(1 - u, 2.2);
            return [P.lerp(260, SX, e), P.lerp(-420, SY, e) + Math.sin(t * 0.8) * 6 * u, P.lerp(0.35, 1, e)];
          }

          function drawLiving(t) {
            // étoile
            const sc = starLayer.getContext("2d");
            sc.clearRect(0, 0, W, H);
            const [x, y, s] = starPos(t);
            const landed = P.smooth((t - FALL1 + 0.4) / 1.2);
            const pulse = 1 + Math.sin(t * 1.4) * 0.015 * landed;
            sc.save();
            sc.translate(x, y);
            sc.rotate(-0.12 + (1 - s) * 0.9);
            sc.scale(s * pulse, s * pulse);
            sc.drawImage(starCan, -450, -450);
            sc.restore();
            // traînée pendant la chute
            if (t > FALL0 && t < FALL1 + 0.5) {
              const fall = 1 - landed;
              sc.save();
              sc.globalCompositeOperation = "lighter";
              for (let i = 1; i < 16; i++) {
                const [tx, ty] = starPos(t - i * 0.05);
                P.glow(sc, tx, ty, 120 * s * (1 - i / 16), "#f4f7a0", 0.22 * fall * (1 - i / 16));
              }
              sc.restore();
            }
            // petites étoiles qui flottent
            for (const st of smallStars) {
              const yy = st.y + st.v * t;
              sc.save();
              sc.translate(st.x + Math.sin(t * 0.5 + st.ph) * 10, yy);
              sc.rotate(st.rot + t * 0.1);
              const tw = 0.6 + 0.4 * Math.sin(t * 1.7 + st.ph);
              P.glow(sc, 0, 0, st.r * 2.8, "#eef59a", 0.3 * tw);
              sc.fillStyle = `rgba(246,240,160,${0.55 + 0.3 * tw})`;
              P.starPath(sc, 0, 0, st.r, 0.45, 0);
              sc.fill();
              sc.restore();
            }

            // cheval à la porte du box, qui lève la tête vers l'étoile
            const hc = horseLayer.getContext("2d");
            hc.clearRect(0, 0, W, H);
            hctx.clearRect(0, 0, 300, 260);
            const look = P.smooth((t - 4.4) / 1.4);
            P.drawHorse(hctx, 230, 330, 0.62, { head: 0.3 - look * 0.32, nod: Math.sin(t * 1.1) * 0.4, breath: 0, earFlick: P.smooth((t - 3.2) / 0.3) - P.smooth((t - 3.8) / 0.3) }, { body: "#6a4330", mane: "#2c1a12", seed: 5 }, true);
            P.shadeFigure(hcan, { gradient: [0, 0, 300, 0], gradColors: ["rgba(255,236,150,0.2)", "rgba(10,20,30,0.3)"], texture: tex, textureAlpha: 0.35 });
            hc.save();
            hc.beginPath();
            hc.rect(DOOR.x - 220, DOOR.y - 170, DOOR.w + 220, DOOR.h + 170);
            hc.clip();
            hc.drawImage(hcan, DOOR.x - 150, DOOR.y - 150);
            hc.restore();
            const wink = 0.85 + 0.15 * Math.sin(t * 7.3) * Math.sin(t * 3.1);
            hc.save();
            hc.globalCompositeOperation = "lighter";
            P.glow(hc, 1680, 650, 160, "#ff7a3a", 0.18 * wink);
            hc.restore();
            P.breathPuff(hc, DOOR.x - 6, DOOR.y + 20 - look * 30, t, 3.4, -1, 0.7, 0.6 * (0.4 + look));

            // traîneau minuscule qui s'éloigne dans la brume
            fctx.clearRect(0, 0, 1920, 1080);
            const sl = (t - 7.4) / 4.2;
            if (sl > 0 && sl < 1) {
              const sx = P.lerp(1500, 1880, sl),
                sy = P.lerp(210, 120, sl) + Math.sin(sl * 8) * 4;
              const a = Math.sin(sl * Math.PI) * 0.8;
              fctx.save();
              fctx.globalAlpha = a;
              fctx.fillStyle = "#06161b";
              fctx.translate(sx, sy);
              fctx.scale(0.9 - sl * 0.4, 0.9 - sl * 0.4);
              // rennes
              for (let i = 0; i < 4; i++) {
                const rx = 30 + i * 22,
                  ry = -6 - i * 4 + Math.sin(sl * 30 + i) * 2;
                fctx.fillRect(rx, ry, 14, 5);
                fctx.fillRect(rx + 12, ry - 6, 3, 7);
                fctx.fillRect(rx + 1, ry + 5, 2, 6);
                fctx.fillRect(rx + 10, ry + 5, 2, 6);
              }
              fctx.beginPath();
              fctx.moveTo(-18, 2);
              fctx.lineTo(16, 2);
              fctx.lineTo(22, -8);
              fctx.lineTo(-12, -8);
              fctx.closePath();
              fctx.fill();
              fctx.fillRect(-20, 4, 40, 2);
              fctx.beginPath();
              fctx.arc(0, -14, 5, 0, P.TAU);
              fctx.fill();
              fctx.restore();
            }
            snow.draw(fctx, t, 0.75);
          }

          // ---------------------------------------------------------- timeline
          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => drawLiving(clock.t) }, 0);
          tl.fromTo("#s2-cam", { scale: 1.0, y: 70 }, { scale: 1.08, y: -24, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo("#s2-p0", { x: -10 }, { x: 14, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s2-p1", { x: -20 }, { x: 30, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s2-p2", { x: -60 }, { x: 70, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s2-light", { opacity: 0.0 }, { opacity: 1, duration: 2.2, ease: "power2.out" }, FALL1 - 0.6);
          tl.to("#s2-light", { opacity: 0.82, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, FALL1 + 1.8);
          drawLiving(0);
          window.__timelines["s2-etoile"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
