<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Instrument Serif";
          font-style: italic;
          font-weight: 400;
          src: url("../assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
        }
        @font-face {
          font-family: "Montserrat";
          font-style: normal;
          font-weight: 500;
          src: url("../assets/fonts/montserrat-latin-500-normal.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #c9d1d6;
        }
        #s1-cam,
        .s1-plane {
          position: absolute;
          inset: 0;
          transform-origin: 50% 46%;
        }
        .s1-plane canvas {
          position: absolute;
          left: -96px;
          top: -54px;
          width: 2112px;
          height: 1188px;
        }
        #s1-rays {
          mix-blend-mode: screen;
        }
        #s1-fx {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
        }
        #s1-title {
          position: absolute;
          left: 0;
          right: 0;
          top: 190px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 26px;
          color: #23303f;
        }
        #s1-kicker {
          font-family: "Montserrat", sans-serif;
          font-weight: 500;
          font-size: 22px;
          letter-spacing: 0.42em;
          text-transform: uppercase;
          color: #2a3746;
        }
        #s1-name {
          font-family: "Instrument Serif", serif;
          font-style: italic;
          font-size: 132px;
          line-height: 1;
          letter-spacing: -0.01em;
          color: #1f2b3a;
          text-shadow: 0 0 40px rgba(255, 246, 220, 0.85);
        }
        #s1-rule {
          width: 220px;
          height: 2px;
          background: #2a3746;
        }
      </style>

      <div id="root" data-composition-id="s1-foret" data-width="1920" data-height="1080">
        <div id="s1-cam" data-layout-allow-overflow>
          <div class="s1-plane" id="s1-p0" data-layout-allow-overflow></div>
          <div class="s1-plane" id="s1-pr" data-layout-allow-overflow></div>
          <div class="s1-plane" id="s1-p1" data-layout-allow-overflow></div>
          <div class="s1-plane" id="s1-p2" data-layout-allow-overflow></div>
        </div>
        <canvas id="s1-fx" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <div id="s1-title">
          <div id="s1-kicker">Dada Sport Paris présente</div>
          <div id="s1-rule"></div>
          <div id="s1-name">Les Chevaux de l’Étoile</div>
        </div>
      </div>

      <script>
        (function () {
          const P = window.Painter;
          const W = 2112,
            H = 1188;
          const DUR = 16.7;
          const LX = 1056,
            LY = 400; // source de lumière, derrière la forêt

          // ---------------------------------------------------------- plan 0 : ciel, forêt lointaine
          const base0 = P.canvas(W, H);
          {
            const c = base0.getContext("2d");
            const R = P.rng(101);
            P.vgrad(c, W, H, [
              [0, "#c3ccd2"],
              [0.32, "#e9e2c9"],
              [0.55, "#f3e7c6"],
              [0.75, "#d9dcd6"],
              [1, "#b8c3cb"],
            ]);
            P.glow(c, LX, LY, 1000, "#fff3cf", 0.9);
            P.glow(c, LX, LY + 40, 520, "#ffe9a8", 0.65);
            // feuillage doré suspendu
            for (let i = 0; i < 900; i++) {
              const x = R() * W;
              const top = -20 + R() * 120;
              const len = 120 + R() * 360 * (1 - Math.abs(x - LX) / W);
              const a = 0.12 + 0.25 * R();
              c.strokeStyle = P.rgba(P.mix("#c9a24f", "#f7e3a4", R()), a);
              c.lineWidth = 1 + R() * 2.4;
              c.beginPath();
              c.moveTo(x, top);
              c.quadraticCurveTo(x + (R() - 0.5) * 30, top + len * 0.5, x + (R() - 0.5) * 20, top + len);
              c.stroke();
            }
            // troncs lointains
            for (let i = 0; i < 80; i++) {
              const x = R() * W;
              const dist = Math.abs(x - LX) / (W / 2);
              const w = 5 + R() * 12;
              P.birch(c, R, {
                x,
                base: 790 + R() * 30,
                top: -40,
                w,
                lean: (R() - 0.5) * 0.04,
                light: 0.6,
                lightSide: x < LX ? 1 : -1,
                color: P.mix("#efeee6", "#d9dde0", dist),
                shade: P.mix("#c9ccc4", "#a9b6c1", dist),
                mark: "#6d737c",
                marks: 1.2,
                markAlpha: 0.55,
                rim: "#fff8e2",
              });
            }
            // brume
            P.fog(c, R, -100, 560, W + 100, 840, 60, 140, 380, "#f6f1e2", 0.35);
            P.fog(c, R, LX - 500, 300, LX + 500, 700, 14, 200, 420, "#fff5d6", 0.35);
            // sol lointain
            const g = c.createLinearGradient(0, 760, 0, H);
            g.addColorStop(0, "#efece2");
            g.addColorStop(1, "#c7d0d8");
            c.fillStyle = g;
            c.beginPath();
            c.moveTo(0, 800);
            c.bezierCurveTo(500, 760, 800, 790, LX, 780);
            c.bezierCurveTo(1400, 770, 1700, 790, W, 770);
            c.lineTo(W, H);
            c.lineTo(0, H);
            c.closePath();
            c.fill();
          }
          const paint0 = P.brushify(base0, {
            seed: 11,
            flowAngle: -Math.PI / 2,
            flowSpread: 1.2,
            passes: [
              { size: 14, len: 44, density: 1.1, alpha: 0.45, jitter: 8 },
              { size: 6, len: 20, density: 1.0, alpha: 0.5, jitter: 10 },
              { size: 2.6, len: 9, density: 0.7, alpha: 0.65, jitter: 12, edge: 26 },
            ],
          });
          P.mount(document.getElementById("s1-p0"), paint0);

          // ---------------------------------------------------------- rayons de lumière
          const rays = P.canvas(W, H);
          {
            const c = rays.getContext("2d");
            const R = P.rng(77);
            c.filter = "blur(26px)";
            for (let i = 0; i < 14; i++) {
              const a = Math.PI / 2 + (R() - 0.5) * 1.5;
              const spread = 0.03 + R() * 0.06;
              const len = 1100;
              const g = c.createLinearGradient(LX, LY, LX + Math.cos(a) * len, LY + Math.sin(a) * len);
              g.addColorStop(0, "rgba(255,236,180,0.32)");
              g.addColorStop(1, "rgba(255,236,180,0)");
              c.fillStyle = g;
              c.beginPath();
              c.moveTo(LX, LY - 60);
              c.lineTo(LX + Math.cos(a - spread) * len, LY + Math.sin(a - spread) * len);
              c.lineTo(LX + Math.cos(a + spread) * len, LY + Math.sin(a + spread) * len);
              c.closePath();
              c.fill();
            }
            c.filter = "none";
          }
          P.mount(document.getElementById("s1-pr"), rays).id = "s1-rays";

          // ---------------------------------------------------------- plan 1 : bouleaux, sol, ombres
          const base1 = P.canvas(W, H);
          const shadows1 = [];
          {
            const c = base1.getContext("2d");
            const R = P.rng(202);
            // sol enneigé
            const g = c.createLinearGradient(0, 820, 0, H);
            g.addColorStop(0, "#f1eee4");
            g.addColorStop(0.5, "#dfe4e6");
            g.addColorStop(1, "#b9c6d2");
            c.fillStyle = g;
            c.beginPath();
            c.moveTo(0, 860);
            c.bezierCurveTo(400, 820, 700, 860, LX, 850);
            c.bezierCurveTo(1450, 840, 1750, 870, W, 830);
            c.lineTo(W, H);
            c.lineTo(0, H);
            c.closePath();
            c.fill();
            // chemin éclairé
            c.save();
            c.globalCompositeOperation = "lighter";
            P.glow(c, LX, 900, 520, "#ffe9b0", 0.32);
            c.restore();
            // troncs moyens
            const xs = [180, 330, 460, 620, 760, 850, 1270, 1360, 1500, 1640, 1790, 1930, 560, 1580];
            xs.forEach((x, i) => {
              const w = 22 + R() * 30;
              const base = 860 + R() * 40;
              const side = x < LX ? 1 : -1;
              const dist = Math.abs(x - LX) / (W / 2);
              // ombre portée vers le spectateur
              shadows1.push([x, base, side, w]);
              c.fillStyle = "rgba(96,118,148,0.28)";
              c.beginPath();
              c.moveTo(x - w / 2, base);
              c.lineTo(x + w / 2, base);
              c.lineTo(x + (x - LX) * 0.55 + w * 1.4, H + 40);
              c.lineTo(x + (x - LX) * 0.55 - w * 0.6, H + 40);
              c.closePath();
              c.fill();
              P.birch(c, R, {
                x,
                base,
                top: -60,
                w,
                lean: (R() - 0.5) * 0.06,
                light: 0.9,
                lightSide: side,
                color: "#f2efe6",
                shade: P.mix("#8f9fb0", "#a4b0bc", dist),
                mark: "#262a31",
                marks: 1.6,
                rim: "#fff1c8",
              });
              for (let b = 0; b < 3; b++) {
                const by = 120 + R() * 420;
                P.branch(c, R, x, by, -Math.PI / 2 + side * (0.5 + R() * 0.8), 90 + R() * 160, 3.2, "rgba(48,52,58,0.75)", 2);
              }
            });
            // herbes sèches et feuilles
            for (let i = 0; i < 700; i++) {
              const x = R() * W;
              const y = 870 + Math.pow(R(), 0.7) * 320;
              if (Math.abs(x - LX) < 260 && y < 1000) continue;
              c.fillStyle = P.rgba(P.mix("#9c6a3a", "#c98f4e", R()), 0.55 + 0.4 * R());
              c.beginPath();
              c.ellipse(x, y, 4 + R() * 6, 2 + R() * 2.5, R() * Math.PI, 0, P.TAU);
              c.fill();
            }
          }
          const paint1 = P.brushify(base1, {
            seed: 21,
            mask: true,
            flowAngle: -Math.PI / 2,
            flowSpread: 0.9,
            passes: [
              { size: 9, len: 30, density: 1.0, alpha: 0.5, jitter: 8 },
              { size: 4, len: 14, density: 1.0, alpha: 0.55, jitter: 10 },
              { size: 2, len: 7, density: 0.8, alpha: 0.7, jitter: 12, edge: 24 },
            ],
          });
          const p1 = document.getElementById("s1-p1");
          P.mount(p1, paint1);
          const horseLayer = P.mount(p1, P.canvas(W, H), "layer");

          // ---------------------------------------------------------- plan 2 : avant-plan
          const base2 = P.canvas(W, H);
          {
            const c = base2.getContext("2d");
            const R = P.rng(303);
            [
              [40, 120, 1],
              [250, 80, 1],
              [1870, 110, -1],
              [2060, 140, -1],
            ].forEach(([x, w, side]) => {
              P.birch(c, R, {
                x,
                base: H + 40,
                top: -120,
                w,
                lean: side * 0.015,
                light: 0.55,
                lightSide: side,
                color: "#dfe2e0",
                shade: "#6f8296",
                mark: "#1d2127",
                marks: 1.4,
                rim: "#ffeec2",
              });
            });
            // congères d'avant-plan
            const g = c.createLinearGradient(0, 980, 0, H);
            g.addColorStop(0, "#e8ebea");
            g.addColorStop(1, "#a9b9c9");
            c.fillStyle = g;
            c.beginPath();
            c.moveTo(-10, 1010);
            c.bezierCurveTo(260, 960, 520, 1060, 760, H + 10);
            c.lineTo(-10, H + 10);
            c.closePath();
            c.fill();
            c.beginPath();
            c.moveTo(W + 10, 990);
            c.bezierCurveTo(1820, 950, 1560, 1050, 1380, H + 10);
            c.lineTo(W + 10, H + 10);
            c.closePath();
            c.fill();
            for (let i = 0; i < 420; i++) {
              const left = R() < 0.5;
              const x = left ? R() * 640 : W - R() * 640;
              const y = 1000 + R() * 200;
              c.strokeStyle = P.rgba(P.mix("#7a5a3a", "#b88a55", R()), 0.7);
              c.lineWidth = 1.2 + R() * 1.8;
              c.beginPath();
              c.moveTo(x, y);
              c.quadraticCurveTo(x + (R() - 0.5) * 20, y - 30, x + (R() - 0.5) * 40, y - 40 - R() * 50);
              c.stroke();
            }
          }
          const paint2 = P.brushify(base2, {
            seed: 31,
            mask: true,
            flowAngle: -Math.PI / 2,
            flowSpread: 0.8,
            passes: [
              { size: 12, len: 40, density: 1.0, alpha: 0.5, jitter: 8 },
              { size: 5, len: 18, density: 1.0, alpha: 0.55, jitter: 10 },
            ],
          });
          P.mount(document.getElementById("s1-p2"), paint2);

          // ---------------------------------------------------------- éléments vivants
          const fx = document.getElementById("s1-fx");
          const fctx = fx.getContext("2d");
          const snowFar = P.makeSnow(5, 260, 1920, 1080, { rmin: 0.8, rmax: 2.4, vmin: 18, vmax: 40, wind: 10, color: "#fffaf0" });
          const snowNear = P.makeSnow(6, 70, 1920, 1080, { rmin: 2.5, rmax: 6, vmin: 50, vmax: 95, wind: 22, color: "#fffaf0" });
          const tex = P.paperTexture(520, 420, 9);
          const hcan = P.canvas(620, 520);
          const hctx = hcan.getContext("2d");
          const ringR = P.rng(404);
          const motes = [];
          for (let i = 0; i < 760; i++) {
            const band = ringR();
            motes.push({ a: ringR() * P.TAU, r: 0.82 + Math.pow(band, 2) * 0.4, s: 0.15 + ringR() * 0.45, sz: 1.2 + Math.pow(ringR(), 3) * 5.5, ph: ringR() * P.TAU, y: (ringR() - 0.5) * 0.3, star: ringR() < 0.06 });
          }
          const HX = LX + 6,
            HY = 918,
            HS = 1.3;

          function drawLiving(t) {
            // cheval à contre-jour
            const hc = horseLayer.getContext("2d");
            hc.clearRect(0, 0, W, H);
            const lift = P.smooth((t - 8.2) / 1.6) - P.smooth((t - 13.2) / 1.8) * 0.6;
            const pose = {
              head: 0.18 - lift * 0.22,
              nod: Math.sin(t * 0.9) * 0.3,
              tail: Math.sin(t * 0.7) * 0.6,
              breath: (Math.sin(t * 1.6) + 1) / 2,
              earFlick: P.smooth((t - 4.6) / 0.3) - P.smooth((t - 5.2) / 0.3),
              wind: 0.4 + Math.sin(t * 0.8) * 0.3,
            };
            hctx.clearRect(0, 0, 620, 520);
            const m = P.drawHorse(hctx, 300, 490, HS, pose, { body: "#30323f", mane: "#1d1e28", eye: false, seed: 3 });
            P.shadeFigure(hcan, { gradient: [0, 160, 0, 490], gradColors: ["rgba(92,86,96,0.55)", "rgba(24,28,44,0.0)"], texture: tex, textureAlpha: 0.4 });
            // ombre au sol
            hc.save();
            hc.filter = "blur(6px)";
            hc.fillStyle = "rgba(70,86,112,0.32)";
            hc.beginPath();
            hc.ellipse(HX - 10, HY + 6, 200, 15, 0, 0, P.TAU);
            hc.fill();
            hc.restore();
            const k = P.smooth((t - 1.5) / 4.5) * (1 - 0.35 * P.smooth((t - 13) / 3));
            // halo doré derrière la silhouette
            P.bloom(horseLayer, hcan, "#ffcf73", 22, 0.55 + 0.35 * k, HX - 300, HY - 490);
            P.rimLight(hcan, hcan, "#ffe3a0", 0, 6, 1.0, 1.6);
            hc.drawImage(hcan, HX - 300, HY - 490);
            // buée
            P.breathPuff(hc, HX - 300 + m.muzzle[0], HY - 490 + m.muzzle[1], t + 0.4, 3.2, 1, 1.2, 0.9);

            // anneau de particules dorées (halo magique autour du cheval)
            hc.save();
            hc.globalCompositeOperation = "lighter";
            hc.filter = "blur(18px)";
            hc.strokeStyle = `rgba(255,214,130,${0.35 * k})`;
            hc.lineWidth = 46;
            hc.beginPath();
            hc.ellipse(HX, HY - 230, 400, 300, 0, 0, P.TAU);
            hc.stroke();
            hc.filter = "none";
            for (const p of motes) {
              const a = p.a + t * p.s * 0.5;
              const rx = 400 * p.r,
                ry = 300 * p.r;
              const x = HX + Math.cos(a) * rx;
              const y = HY - 230 + Math.sin(a) * ry + p.y * 140;
              if (y > HY + 30) continue;
              const tw = 0.5 + 0.5 * Math.sin(p.ph + t * 2.6);
              const al = Math.min(1, k * tw * (0.55 + 0.45 * (Math.sin(a) * 0.5 + 0.5)) * 1.3);
              if (al < 0.03) continue;
              P.glow(hc, x, y, p.sz * 4, "#ffc864", al * 0.8);
              hc.fillStyle = `rgba(255,250,228,${al})`;
              hc.beginPath();
              hc.arc(x, y, p.sz * 0.5, 0, P.TAU);
              hc.fill();
              if (p.star) P.sparkle(hc, x, y, p.sz * 1.4, al, "#fff6dc");
            }
            hc.restore();

            // neige
            fctx.clearRect(0, 0, 1920, 1080);
            snowFar.draw(fctx, t, 0.7);
            snowNear.draw(fctx, t, 0.9);
          }

          // ---------------------------------------------------------- timeline
          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => drawLiving(clock.t) }, 0);
          tl.fromTo("#s1-cam", { scale: 1.0 }, { scale: 1.09, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo("#s1-p0", { x: 10 }, { x: -12, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s1-p1", { x: 24, y: 0 }, { x: -26, y: -6, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s1-p2", { x: 70, scale: 1.0 }, { x: -70, scale: 1.05, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#s1-rays", { opacity: 0.55 }, { opacity: 1, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
          // titre
          tl.fromTo("#s1-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.6, ease: "power2.out" }, 0.9);
          tl.fromTo("#s1-rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.inOut" }, 1.5);
          tl.fromTo("#s1-name", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 2.0, ease: "power2.out" }, 1.8);
          tl.to("#s1-title", { opacity: 0, y: -30, filter: "blur(8px)", duration: 1.4, ease: "power2.in" }, 5.4);
          drawLiving(0);
          window.__timelines["s1-foret"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
