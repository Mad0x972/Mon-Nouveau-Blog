<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Les Chevaux de l’Étoile — Dada Sport Paris</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/painter.js"></script>
    <script src="assets/products.js"></script>
    <style>
      @font-face {
        font-family: "Instrument Serif";
        font-style: normal;
        font-weight: 400;
        src: url("assets/fonts/instrument-serif-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        font-weight: 400;
        src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Montserrat";
        font-style: normal;
        font-weight: 300;
        src: url("assets/fonts/montserrat-latin-300-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Montserrat";
        font-style: normal;
        font-weight: 500;
        src: url("assets/fonts/montserrat-latin-500-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0f16;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f16;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      #grain,
      #vignette,
      #fade {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #grain {
        width: 1920px;
        height: 1080px;
        mix-blend-mode: overlay;
        opacity: 0.16;
      }
      #vignette {
        background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(8, 12, 22, 0) 55%, rgba(8, 12, 22, 0.55) 100%);
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 64px;
        background: #07090d;
      }
      #bar-top {
        top: 0;
      }
      #bar-bottom {
        bottom: 0;
      }
      #fade {
        background: #07090d;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="79" data-width="1920" data-height="1080">
      <div
        id="s1-foret"
        class="scene"
        data-composition-id="s1-foret"
        data-composition-src="compositions/s1-foret.html"
        data-start="0"
        data-duration="16.7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="s2-etoile"
        class="scene"
        data-composition-id="s2-etoile"
        data-composition-src="compositions/s2-etoile.html"
        data-start="15.6"
        data-duration="12.9"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="s3-aube"
        class="scene"
        data-composition-id="s3-aube"
        data-composition-src="compositions/s3-aube.html"
        data-start="27.4"
        data-duration="13.1"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="s4-cadeaux"
        class="scene"
        data-composition-id="s4-cadeaux"
        data-composition-src="compositions/s4-cadeaux.html"
        data-start="39.4"
        data-duration="19.7"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="s5-sapin-rose"
        class="scene"
        data-composition-id="s5-sapin-rose"
        data-composition-src="compositions/s5-sapin-rose.html"
        data-start="57.8"
        data-duration="13.5"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="s6-fin"
        class="scene"
        data-composition-id="s6-fin"
        data-composition-src="compositions/s6-fin.html"
        data-start="69.8"
        data-duration="9.2"
        data-track-index="6"
        data-width="1920"
        data-height="1080"
      ></div>

      <canvas id="grain" width="1920" height="1080"></canvas>
      <div id="vignette"></div>
      <div class="bar" id="bar-top"></div>
      <div class="bar" id="bar-bottom"></div>
      <div id="fade"></div>

      <audio id="voix-off" src="assets/audio/voix-off.mp3" data-start="0" data-duration="79" data-track-index="10" data-volume="1"></audio>
      <audio id="musique" src="assets/audio/musique.mp3" data-start="0" data-duration="79" data-track-index="11" data-volume="1"></audio>
      <audio id="ambiance" src="assets/audio/ambiance.mp3" data-start="0" data-duration="79" data-track-index="12" data-volume="1"></audio>
    </div>
    <script>
      (function () {
        const P = window.Painter;
        // grain de pellicule : une texture, décalée à chaque image (déterministe)
        const grain = document.getElementById("grain");
        const g = grain.getContext("2d");
        const tile = P.canvas(512, 512);
        {
          const c = tile.getContext("2d");
          const img = c.createImageData(512, 512);
          const R = P.rng(2412);
          for (let i = 0; i < img.data.length; i += 4) {
            const v = 128 + (R() + R() + R() - 1.5) * 120;
            img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
            img.data[i + 3] = 255;
          }
          c.putImageData(img, 0, 0);
        }
        const pattern = g.createPattern(tile, "repeat");
        function drawGrain(t) {
          const f = Math.floor(t * 24);
          const ox = Math.floor(P.hash(f) * 512),
            oy = Math.floor(P.hash(f + 0.5) * 512);
          g.setTransform(1, 0, 0, 1, -ox, -oy);
          g.fillStyle = pattern;
          g.fillRect(ox, oy, 1920, 1080);
          g.setTransform(1, 0, 0, 1, 0, 0);
        }

        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: 79, duration: 79, ease: "none", onUpdate: () => drawGrain(clock.t) }, 0);
        // ouverture au noir puis fondu final
        tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 2.2, ease: "power1.inOut" }, 0.1);
        tl.to("#fade", { opacity: 1, duration: 2.0, ease: "power1.in" }, 77.0);
        // fondus enchaînés entre les tableaux
        tl.fromTo("#s2-etoile", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "sine.inOut" }, 15.6);
        tl.fromTo("#s3-aube", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "sine.inOut" }, 27.4);
        tl.fromTo("#s4-cadeaux", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "sine.inOut" }, 39.4);
        tl.fromTo("#s5-sapin-rose", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "sine.inOut" }, 57.8);
        tl.fromTo("#s6-fin", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "sine.inOut" }, 69.8);
        drawGrain(0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
