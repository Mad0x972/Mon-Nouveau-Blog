      // ---- handwriting scribbles (deterministic)
      qa(".f02-scrib").forEach(function (svg) {

        svg.setAttribute("viewBox", "0 0 " + w + " 18");

        while (x < w - 10) {
          var step = 6 + rnd() * 9;
          x += step;
          d += " Q" + (x - step / 2).toFixed(1) + "," + (rnd() < 0.5 ? 2 + rnd() * 5 : 13 + rnd() * 5).toFixed(1) + " " + x.toFixed(1) + "," + (8 + rnd() * 6).toFixed(1);
        }
        var p = document.createElementNS(SVGNS, "path");
        p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "#2B4C9B"); p.setAttribute("stroke-width", "2"); p.setAttribute("stroke-linecap", "round");
        svg.appendChild(p);
        var base = document.createElementNS(SVGNS, "line");
        base.setAttribute("x1", 0); base.setAttribute("x2", w); base.setAttribute("y1", 17); base.setAttribute("y2", 17);
        base.setAttribute("stroke", "#B7BFCC"); base.setAttribute("stroke-width", "1.5");
        svg.appendChild(base);
      });
      // ticks on some checkboxes
      qa(".f02-box").forEach(function (b, k) {
        if (k % 3 === 1) return;
        b.innerHTML = '<svg width="15" height="15" viewBox="0 0 15 15" style="position:absolute;left:-2px;top:-4px"><path d="M2,8 L6,12 L15,1" stroke="#2B4C9B" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
      });

      // ---- sun rays
      var rays = q("#f02-rays");
      for (var i = 0; i < 24; i++) {
        var a = (i / 24) * Math.PI * 2;
        var r1 = 200, r2 = 400, hw = 0.05;
        var pts = [[400 + Math.cos(a - hw) * r1, 400 + Math.sin(a - hw) * r1], [400 + Math.cos(a) * r2, 400 + Math.sin(a) * r2], [400 + Math.cos(a + hw) * r1, 400 + Math.sin(a + hw) * r1]];
        var poly = document.createElementNS(SVGNS, "polygon");
        poly.setAttribute("points", pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "));
        poly.setAttribute("fill", i % 2 ? "rgba(251,149,0,0.16)" : "rgba(251,149,0,0.10)");
        rays.appendChild(poly);
      }

      // ---- chaos items: landed center (cx,cy), size, rotation, entry offset
      var CX = 960, CY = 520;
      var items = [
        { id: "#f02-F1", w: 280, h: 360, rot: -9, t: 0.14, from: [-760, 60, -30] },
        { id: "#f02-F2", w: 280, h: 360, rot: 5, t: 0.26, from: [-820, 260, 25] },
        { id: "#f02-F3", w: 280, h: 360, rot: -2, t: 0.38, from: [-900, -120, -20] },
        { id: "#f02-P1", w: 230, h: 272, rot: -14, t: 1.62, burst: true },
        { id: "#f02-P2", w: 230, h: 272, rot: 7, t: 1.70, burst: true },
        { id: "#f02-P3", w: 230, h: 272, rot: 12, t: 1.78, burst: true },
        { id: "#f02-P4", w: 230, h: 272, rot: -9, t: 1.86, burst: true },
        { id: "#f02-P5", w: 230, h: 272, rot: 10, t: 1.94, burst: true },
        { id: "#f02-R", w: 360, h: 470, rot: 4, t: 3.02, from: [900, -60, 18] },
        { id: "#f02-S1", w: 470, h: 96, rot: -2, t: 4.30, pop: true },
        { id: "#f02-S2", w: 440, h: 96, rot: 1.5, t: 4.72, pop: true },
        { id: "#f02-S3", w: 270, h: 96, rot: -1, t: 5.14, pop: true },
        { id: "#f02-W", w: 560, h: 300, rot: -3, t: 4.88, from: [0, 520, -6] },

        { id: "#f02-C", w: 620, h: 120, rot: -2, t: 5.98, from: [0, -900, 0] },
        { id: "#f02-badge", w: 64, h: 64, rot: 0, t: 6.30, pop: true }
      ];
      items.forEach(function (it) {
        var el = q(it.id);
        it.el = el;
        var left = parseFloat(el.style.left), top = parseFloat(el.style.top);
        it.cx = left + it.w / 2; it.cy = top + it.h / 2;
      });

      // grid slots (4 x 4) for "tout se range d'un coup"
      var cellW = 280, cellH = 180, gap = 26;
      var gridW = 4 * cellW + 3 * gap, gridH = 4 * cellH + 3 * gap;
      var gx0 = CX - gridW / 2 + cellW / 2, gy0 = CY - gridH / 2 + cellH / 2;

      var tl = gsap.timeline({ paused: true });

      // ---- ambient
      tl.fromTo("#f02-lamp", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0);

      // ---- carry-over: the sheets flying at the end of 01 keep flying across the cut
      var carry = [[1500, 150, 220, 0], [1790, 330, -260, 1], [1330, 520, 300, 2], [1660, 640, -200, 3], [1860, 770, 240, 6], [1440, 290, -180, 7]];
      var carryBox = q("#f02-carry");
      carry.forEach(function (c, j) {
        var d = document.createElement("div");
        d.className = "f02-csheet";
        d.style.left = (c[0] - 75) + "px"; d.style.top = (c[1] - 98) + "px";
        carryBox.appendChild(d);
        var k = c[3];
        tl.fromTo(d, { x: 0, y: 0, rotation: c[2], rotationX: (k % 2 ? 38 : -32), rotationY: (k % 3 ? -28 : 34), scale: 0.95 + (k % 5) * 0.12, opacity: 1, transformPerspective: 900 },

      });

      // ---- entrances (landed state = CSS position, rotation via GSAP)
      items.forEach(function (it, k) {
        if (it.burst) {
          tl.fromTo(it.el, { x: CX - it.cx, y: CY - it.cy, rotation: 0, scale: 0.2, opacity: 0 },
            { x: 0, y: 0, rotation: it.rot, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" }, it.t);
        } else if (it.pop) {
          tl.fromTo(it.el, { scale: 0.4, opacity: 0, rotation: it.rot, transformOrigin: "50% 50%" },
            { scale: 1, opacity: 1, rotation: it.rot, duration: 0.42, ease: "power3.out" }, it.t);
        } else {
          tl.fromTo(it.el, { x: it.from[0], y: it.from[1], rotation: it.from[2], opacity: 1 },
            { x: 0, y: 0, rotation: it.rot, opacity: 1, duration: (it.id === "#f02-R" ? 0.55 : 0.7), ease: "power3.out" }, it.t);
        }
      });
      // stamp slam on the report
      tl.fromTo("#f02-stamp", { scale: 2.2, opacity: 0, rotation: -24 }, { scale: 1, opacity: 1, rotation: -14, duration: 0.28, ease: "power4.in" }, 3.32);
      tl.fromTo("#f02-R", { x: 0, y: 0 }, { x: 6, y: 4, duration: 0.06, ease: "power1.out", immediateRender: false }, 3.6);
      tl.to("#f02-R", { x: 0, y: 0, duration: 0.18, ease: "power2.out" }, 3.66);
      // clock spinning faster and faster
      tl.fromTo("#f02-clock-m", { rotation: 0 }, { rotation: 2160, svgOrigin: "65 65", duration: 4.4, ease: "power2.in" }, 5.3);
      tl.fromTo("#f02-clock-h", { rotation: 0 }, { rotation: 180, svgOrigin: "65 65", duration: 4.4, ease: "power2.in" }, 5.3);
      // unread badge counter 3 -> 12
      var badge = { n: 3 };
      tl.to(badge, { n: 12, duration: 3.0, ease: "power1.in", onUpdate: function () { q("#f02-badge-n").textContent = Math.round(badge.n); } }, 6.5);

      // ---- pain list (VO cues 0.56 / 1.65 / 3.03)
      tl.fromTo("#f02-pain1", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.56);
      tl.fromTo("#f02-pain2", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.65);
      tl.fromTo("#f02-pain3", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 3.03);

      // ---- headline over the chaos (VO 4.27 / 5.96)
      tl.fromTo("#f02-scrim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 4.15);
      tl.fromTo(".f02-h1", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.12 }, 4.3);
      tl.fromTo(".f02-h2", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 5.98);

      // ---- overwhelm: everything closes in (7.4–9.6), then tremor and freeze
      items.forEach(function (it, k) {
        var dx = (CX - it.cx) * (0.16 + (k % 3) * 0.03), dy = (CY - it.cy) * (0.16 + (k % 4) * 0.025);
        it.closeX = dx; it.closeY = dy; it.closeRot = it.rot + (k % 2 ? 4 : -4);
        tl.fromTo(it.el, { x: 0, y: 0, rotation: it.rot }, { x: dx, y: dy, rotation: it.closeRot, scale: 1.04, duration: 2.2, ease: "power2.inOut", immediateRender: false }, 7.4);
      });
      tl.fromTo("#f02-pains", { y: 0, opacity: 1 }, { y: 30, opacity: 0.55, duration: 2.2, ease: "power2.inOut", immediateRender: false }, 7.4);
      // tremor (finite, deterministic)
      var shakes = [[5, -3], [-6, 4], [4, 5], [-5, -4], [6, 2], [-3, -5], [0, 0]];
      shakes.forEach(function (s, j) {
        tl.to("#f02-chaos", { x: s[0], y: s[1], duration: 0.07, ease: "none" }, 8.9 + j * 0.1);
      });

      // ---- BASCULE (10.0): tout se range d'un coup
      tl.to(["#f02-scrim", "#f02-head", "#f02-pains"], { opacity: 0, duration: 0.14, ease: "power2.in" }, 9.86);
      items.forEach(function (it, k) {

        var gx = gx0 + (slot % 4) * (cellW + gap), gy = gy0 + Math.floor(slot / 4) * (cellH + gap);
        var gs = Math.min((cellW - 16) / it.w, (cellH - 16) / it.h);

          { x: gx - it.cx, y: gy - it.cy, rotation: 0, scale: gs, duration: 0.34, ease: "expo.out", immediateRender: false }, 10.0 + (k % 4) * 0.012);

      tl.fromTo("#f02-flood", { scale: 0 }, { scale: 1, duration: 0.58, ease: "power3.in" }, 10.7);
