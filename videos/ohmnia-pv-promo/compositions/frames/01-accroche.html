      // ---- roof panels (3 rows x 6 cols, perspective trapezoid)

        var y0 = top0 + r * (rowH + rowGap), y1 = y0 + rowH;

          var W0 = xr(y0) - xl(y0), W1 = xr(y1) - xl(y1);
          var p = [[xl(y0) + u0 * W0, y0], [xl(y0) + u1 * W0, y0], [xl(y1) + u1 * W1, y1], [xl(y1) + u0 * W1, y1]];
          var pts = p.map(function (v) { return v[0].toFixed(1) + "," + v[1].toFixed(1); }).join(" ");
          var grp = document.createElementNS(SVGNS, "g");
          var poly = document.createElementNS(SVGNS, "polygon");
          poly.setAttribute("points", pts);
          poly.setAttribute("fill", "url(#f01-panelGrad)");
          poly.setAttribute("stroke", "#D6E5F8");
          poly.setAttribute("stroke-width", "2.5");
          grp.appendChild(poly);
          // cell texture
          var mtx = (p[0][0] + p[1][0]) / 2, mbx = (p[3][0] + p[2][0]) / 2;
          var l1 = document.createElementNS(SVGNS, "line");
          l1.setAttribute("x1", mtx.toFixed(1)); l1.setAttribute("y1", y0); l1.setAttribute("x2", mbx.toFixed(1)); l1.setAttribute("y2", y1);
          var l2 = document.createElementNS(SVGNS, "line");

          l2.setAttribute("x1", xlm.toFixed(1)); l2.setAttribute("y1", ym); l2.setAttribute("x2", xrm.toFixed(1)); l2.setAttribute("y2", ym);
          [l1, l2].forEach(function (l) { l.setAttribute("stroke", "rgba(214,229,248,0.28)"); l.setAttribute("stroke-width", "1.5"); grp.appendChild(l); });

        s.style.width = sz.toFixed(1) + "px"; s.style.height = sz.toFixed(1) + "px";

        sheetsBox.appendChild(d);

      tl.fromTo("#f01-land", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 0);

      tl.fromTo(".f01-w1", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out", stagger: 0.09 }, 2.12);
      tl.fromTo("#f01-hand-m", { rotation: 0 }, { rotation: 720, svgOrigin: "43 43", duration: 1.15, ease: "power1.inOut" }, 2.15);
      tl.fromTo("#f01-hand-h", { rotation: 0 }, { rotation: 60, svgOrigin: "43 43", duration: 1.15, ease: "power1.inOut" }, 2.15);

      // ---- sunset in the pause (3.34–3.76)
      tl.to("#f01-sun", { y: 760, duration: 0.62, ease: "power2.in" }, 3.22);
